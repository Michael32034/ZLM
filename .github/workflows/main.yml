name: Build debug version

on:
  push:
      branches: [ develop ]

jobs:
    build:
        runs-on: ubuntu-22.04
        steps:
            - uses: actions/checkout@v4
            - name: Build APK
              uses: digreatbrian/buildozer-action@v2
              with:
                    python-version: 3.9
                    buildozer-cmd: buildozer android debug

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: package
                  path: ./bin/*.apk
